; llama.cpp router-mode preset config.
; Each section name (in brackets) is the model ID the embedding client
; sends in the `model` field of /v1/embeddings requests.
; Paths are inside the container — host files live under ./llama_server/models/.

[embeddinggemma-300m]
model = /models/embeddinggemma-300M-Q8_0.gguf
embeddings = true
ngl = 99
; No `pooling` key: the GGUF carries the model's pooling type (last token),
; inherited from the ggml-org conversion.
load-on-startup = true
; ubatch must be >= max input length (pooling models process one whole input
; per pass). The router passes this key through as --ubatch-size.
ctx-size = 1024
batch-size = 1024
ubatch-size = 1024
parallel = 1

[qwen3-reranker-0.6b]
model = /models/qwen3-reranker-0.6b-q8_0.gguf
; Species-2 reranker (causal-LM judge): --reranking implies embedding mode +
; RANK pooling (last token -> P(yes) at /v1/rerank). Needs the pinned build.
reranking = true
ngl = 99
load-on-startup = true
; ubatch must cover the full query + chunk pair (RANK pooling sees all tokens).
ctx-size = 1024
batch-size = 1024
ubatch-size = 1024
parallel = 1

