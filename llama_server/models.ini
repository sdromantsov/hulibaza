; llama.cpp router-mode preset config.
; Each section name (in brackets) is the model ID the embedding client
; sends in the `model` field of /v1/embeddings requests.
; Paths are inside the container — host files live under ./llama_server/models/.

[nomic-v2-moe]
model = /models/nomic-embed-text-v2-moe.Q4_K_S.gguf
embeddings = true
ngl = 99
pooling = mean
load-on-startup = true
; Chunks are <=500 tokens (nomic's native 512 context), but the KV cache /
; physical batch must hold several concurrently-decoded sequences at once.
; With everything pinned at 512 (== max seq len) there was ZERO headroom:
; two ~500-tok chunks co-scheduled under load overflow the 512-slot batch and
; the server returns "Context size has been exceeded". 2048 gives ~4x room.
ctx-size = 2048
batch-size = 2048
ubatch-size = 2048
ctk=q4_0
ctv=q4_0
; Unified KV: the pool (ctx-size) must hold the SUM of all concurrently-decoded
; sequences (ctx = parallel x max_seq_len). 2 slots x 500-tok chunks = 1000 <<
; 2048, comfortable margin.
parallel = 1

[qwen3-embed-4b]
model = /models/Qwen3-Embedding-4B-Q4_K_M.gguf
embeddings = true
ngl = 99
pooling = last
load-on-startup = true
# Unified KV pool sized for parallel x max_seq_len. Chunks are <=1024 tokens;
# 2 concurrent slots need >=2x1024=2048, so 3072 leaves headroom for qwen's EOS
# (last-pooling) + tokenizer drift. This is what lets sections ingest CONCURRENTLY
# without "Context size has been exceeded" (the router auto-picks 4 slots on a
# 2048 pool = only 512/slot, which overflowed on 1024-token chunks).
ctx-size = 3072
batch-size = 2048
ubatch-size = 2048
ctk=q4_0
ctv=q4_0
parallel = 1

