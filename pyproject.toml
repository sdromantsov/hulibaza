[project]
name = "hulibaza"
version = "0.1.0"
description = "Self-hosted grounded-retrieval MCP service (MVP)."
requires-python = ">=3.12"
dependencies = [
    "pathspec==1.1.1",
    "pymupdf==1.27.2.2",
    "pydantic==2.12.5",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
    "qdrant-client==1.17.1",
    "psycopg[binary]==3.3.3",
    "tokenizers==0.22.2",
    "mcp==2.1.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hulibaza = ["data/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["pg_data", "qdrant_data", ".venv", ".git"]
asyncio_mode = "auto"
markers = [
    "unit: no external services needed",
    "integration: requires external services (Qdrant, PostgreSQL, embedder)",
]
