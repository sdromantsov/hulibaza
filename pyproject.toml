[project]
name = "hulibaza"
version = "0.1.0"
description = "Self-hosted grounded-retrieval MCP service (MVP)."
requires-python = ">=3.12"
dependencies = [
    "pathspec>=0.9",
    "pymupdf>=1.24",
    "pydantic>=2",
    "pyyaml>=6",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "psycopg[binary]>=3.1",
    "tokenizers>=0.20",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hulibaza = ["data/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["pg_data", "qdrant_data", ".venv", ".git"]
asyncio_mode = "auto"
markers = [
    "unit: no external services needed",
    "integration: requires external services (Qdrant, PostgreSQL, embedder)",
]
